name: Golden Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify template and OpenCode skill conventions
        run: python scripts/verify_standard.py
      - name: Run synthetic no-network unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate access-filtered synthetic retrieval
        run: python -m scripts.evaluate_fixture --min-hit 0.85
      - name: Execute synthetic draft safety demo
        run: python -m scripts.change_demo
      - name: Evaluate public domain seed (not a protected holdout)
        run: python -m scripts.evaluate_fixture --cases examples/fixtures/domain_cases.json --repeats 20 --min-hit 1.0
      - name: Execute offline tool-policy trace examples
        run: python -m scripts.trace_demo
      - name: Verify offline preflight
        run: python scripts/offline_preflight.py
